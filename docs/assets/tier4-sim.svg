<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Simulator: a tiny device with a fast-forwarding clock — multi-day Doze regimes asserted in milliseconds on the JVM">
  <rect x="0" y="0" width="1200" height="140" rx="16" fill="#0B1113"/>
  <rect x="0.5" y="0.5" width="1199" height="139" rx="16" fill="none" stroke="#1D2B2E" stroke-width="1"/>

  <!-- tiny device -->
  <rect x="72" y="22" width="58" height="96" rx="11" fill="#0E171A" stroke="#4DD8C4" stroke-width="2"/>
  <line x1="93" y1="32" x2="109" y2="32" stroke="#2E4A4B" stroke-width="2" stroke-linecap="round"/>
  <!-- its little clock, running unreasonably fast -->
  <circle cx="101" cy="72" r="20" fill="none" stroke="#2E4A4B" stroke-width="2"/>
  <line x1="101" y1="72" x2="101" y2="58" stroke="#7BEFD8" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 101 72" to="360 101 72" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <line x1="101" y1="72" x2="110" y2="72" stroke="#4DD8C4" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 101 72" to="360 101 72" dur="6.6s" repeatCount="indefinite"/>
  </line>

  <!-- fast-forward chevrons -->
  <g fill="none" stroke="#7BEFD8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M152,60 l12,12 l-12,12">
      <animate attributeName="opacity" calcMode="discrete" values="1;0.25;1" keyTimes="0;0.5;0.99" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M170,60 l12,12 l-12,12">
      <animate attributeName="opacity" calcMode="discrete" values="0.25;1;0.25" keyTimes="0;0.5;0.99" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- what it means -->
  <text x="224" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#E9F4F2">simulate { RARE bucket · deep Doze 1–5h · maintenance every 2h }</text>
  <text x="224" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#4DD8C4">→ a multi-day regime, asserted in milliseconds. On the JVM.</text>
  <text x="1152" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4A5D5F" text-anchor="end">no device was harmed (or even required)</text>
</svg>
