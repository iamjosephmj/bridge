    <text x="580" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#75898B">ran only after relaunch</text>
  </g>
  <line x1="48" y1="198" x2="1152" y2="198" stroke="#16211F" stroke-width="1"/>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.27s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.27s" dur="0.45s" fill="freeze"/>
    <text x="48" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#75898B">step events journaled</text>
    <text x="430" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#4DD8C4">2</text>
  </g>
