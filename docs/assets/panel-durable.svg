  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.36s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.36s" dur="0.45s" fill="freeze"/>
