<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Durable acceptance, device-verified: state SUCCEEDED; firstStepExecutions 1 (ran before the kill, replayed after); secondStepExecutions 1 (ran only after relaunch); step events journaled 2; parks 1">
